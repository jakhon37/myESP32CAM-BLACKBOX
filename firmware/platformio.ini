[env:esp32cam]
; Arduino core 2.0.x. Unpinned, this now resolves to core 3.x, which is untested on this board.
platform = espressif32@6.12.0
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv

build_flags =
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue